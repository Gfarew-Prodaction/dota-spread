services:
  - type: web
    name: dota-spread
    runtime: docker
    rootDir: DotaSpread-publish
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # COLLECTOR_ROLE is set manually in Render; later syncs preserve home collection.
    envVars:
      - key: UPDATE_INTERVAL
        value: "10"
      - key: STEAM_BATCH_SIZE
        value: "3"
      - key: LIS_REFRESH_INTERVAL
        value: "60"
      - key: QUOTE_TTL
        value: "120"
      - key: CATALOG_TTL
        value: "600"
      - key: PENDING_TTL
        value: "1800"
      - key: STEAM_REQUEST_INTERVAL
        value: "4"
      - key: STEAM_PRIORITY_SIZE
        value: "200"
      - key: STEAMAPIS_REFRESH_INTERVAL
        value: "60"
      - key: STEAMAPIS_CURRENCY
        value: "USD"
